name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Injected as a repository secret so the build never needs a local.properties file
      # on the runner — exercises the GEMINI_API_KEY env-var fallback in app/build.gradle.kts.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Confirm no secrets are staged
        run: |
          if git ls-files | grep -qx 'local.properties'; then
            echo "local.properties must never be committed" >&2
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble release APK (R8/minify)
        run: ./gradlew assembleRelease --no-daemon
